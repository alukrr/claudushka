<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Настройки Клодушки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #707579);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --err: #d14343;
    --ok: #2e9e5b;
  }
  * { box-sizing: border-box; }
  button { background: transparent; color: inherit; }
  body { margin: 0; padding: 12px 16px 32px; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .chat { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; border: 0; text-align: left;
          color: var(--text); background: transparent; padding: 0; font: inherit; cursor: pointer; }
  .chat .title { font-weight: 600; overflow-wrap: anywhere; }
  .chat .meta { color: var(--hint); font-size: 13px; white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--hint);
         margin-left: 4px; }
  .label { font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--hint); font-size: 13px; margin-top: 6px; overflow-wrap: anywhere; }
  .msg { font-size: 13px; margin-top: 6px; min-height: 0; overflow-wrap: anywhere; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  select, input[type=number], input[type=text] { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--hint);
                               background: var(--bg); color: var(--text); }
  input[type=range] { width: 100%; }
  select:disabled, input:disabled { opacity: .5; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--hint); border-radius: 28px; transition: .2s; opacity: .5; }
  .slider:before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%;
                   transition: .2s; }
  .switch input:checked + .slider { background: var(--btn); opacity: 1; }
  .switch input:checked + .slider:before { transform: translateX(20px); }
  .switch input:disabled + .slider { opacity: .25; }
  .center { text-align: center; color: var(--hint); padding: 40px 8px; }
  .back { background: none; border: 0; color: var(--link); font: inherit; padding: 4px 0 8px; cursor: pointer; }
  .btn { display: block; width: 100%; font: inherit; font-weight: 600; padding: 10px 14px; margin-bottom: 10px; border: 0; border-radius: 10px;
         background: var(--btn); color: var(--btn-text); cursor: pointer; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
  .kv .k { color: var(--hint); overflow-wrap: anywhere; }
  .kv .v { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--bg); margin: 2px 0 6px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--btn); border-radius: 3px; }
  .free { color: var(--hint); font-size: 13px; }
  .pack { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; font: inherit; font-weight: 600;
          padding: 12px 14px; margin-bottom: 8px; border: 0; border-radius: 10px; background: var(--card); color: var(--text); cursor: pointer; }
  .pack:disabled { opacity: .5; }
  .pack .usd { color: var(--hint); font-weight: 400; }
  details.help { background: var(--card); border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
  details.help summary { font-weight: 600; cursor: pointer; }
  .mini { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--hint); border-radius: 8px; cursor: pointer; flex: none; }
  .mini.primary { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .mgr { padding: 6px 0; border-bottom: 1px solid var(--bg); }
  .mgr:last-child { border-bottom: 0; }
  .mgr .who { overflow-wrap: anywhere; }
  .addrow { display: flex; gap: 8px; margin-top: 10px; }
  .addrow button { flex: none; }
  .helptext { white-space: pre-wrap; font-size: 14px; margin-top: 8px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="app"><div class="center">Загрузка…</div></div>
<script>
(function () {
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp;
  var app = document.getElementById("app");
  var initData = tg ? tg.initData : "";
  var current = null;      // id открытого чата (null — список)
  var directChat = null;   // чат из start_param (ссылка ?startapp=chat_n<id>) или ?chat=<id> из диплинка — не подписанный выбор экрана, права проверяет сервер
  var screen = "list";     // "list" | "chat" | "costs" | "topup" — что назад вернёт BackButton

  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function clear() { while (app.firstChild) app.removeChild(app.firstChild); }
  function message(text) { clear(); app.appendChild(el("div", "center", text)); }

  function api(method, path, body) {
    var opts = { method: method, headers: { "Authorization": "tma " + initData } };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, data: j }; });
    });
  }

  function showBack(on) {
    if (!tg || !tg.BackButton) return;
    if (on) { tg.BackButton.show(); } else { tg.BackButton.hide(); }
  }
  if (tg && tg.BackButton) tg.BackButton.onClick(function () {
    if ((screen === "costs" || screen === "topup") && current !== null) { openChat(current); } else { openList(); }
  });

  function openList() {
    current = null; screen = "list"; showBack(false);
    message("Загрузка…");
    api("GET", "/api/chats").then(function (r) {
      if (r.status !== 200) return message(r.data.message || "Ошибка загрузки.");
      clear();
      app.appendChild(el("h1", "", "Чаты"));
      r.data.chats.forEach(function (c) {
        var card = el("div", "card");
        var b = el("button", "chat");
        var left = el("span");
        left.appendChild(el("span", "title", c.title));
        b.appendChild(left);
        var meta = el("span", "meta");
        if (c.is_group && c.is_admin) meta.appendChild(el("span", "tag", "админ"));
        meta.appendChild(el("span", "tag", c.tier === "paid" ? "платный" : "бесплатный"));
        if (c.banned) meta.appendChild(el("span", "tag", "забанен"));
        b.appendChild(meta);
        b.addEventListener("click", function () { openChat(c.id); });
        card.appendChild(b);
        if (c.can_view_costs) {
          var cb = el("button", "back", "Расходы");
          cb.addEventListener("click", function () { openCosts(c.id); });
          card.appendChild(cb);
        }
        app.appendChild(card);
      });
    }).catch(function () { message("Нет связи с сервером."); });
  }

  function openChat(id) {
    current = id; screen = "chat"; showBack(true);
    message("Загрузка…");
    api("GET", "/api/chats/" + id + "/settings").then(function (r) {
      if (r.status !== 200) {
        message(r.data.message || "Ошибка загрузки.");
        return;
      }
      render(r.data);
    }).catch(function () { message("Нет связи с сервером."); });
  }

  function render(data) {
    clear();
    var h = el("h1", "", data.chat.title);
    h.appendChild(el("span", "tag", data.chat.tier === "paid" ? "платный" : "бесплатный"));
    if (data.chat.is_group && data.chat.is_admin) h.appendChild(el("span", "tag", "админ"));
    app.appendChild(h);
    if (data.chat.can_topup) {
      var tb = el("button", "btn", "Пополнить баланс ⭐");
      tb.addEventListener("click", function () { openTopup(data.chat.id); });
      app.appendChild(tb);
    }
    if (data.chat.can_view_costs) {
      var cb = el("button", "btn", "Расходы");
      cb.addEventListener("click", function () { openCosts(data.chat.id); });
      app.appendChild(cb);
    }
    if (data.chat.can_view_managers) app.appendChild(managersCard(data.chat.id));
    data.settings.forEach(function (s) { app.appendChild(settingCard(data.chat.id, s)); });
  }

  // ---- Раздел «Управляющие» на экране группы (ТЗ tz-miniapp-managers.md). Права проверяет сервер; здесь только textContent. ----
  function managersCard(id) {
    var box = el("div", "card");
    box.appendChild(el("div", "label", "Управляющие"));
    var body = el("div");
    box.appendChild(body);
    box.appendChild(el("div", "hint", "Управляющий получает в боте права админа этого чата (настройки, расходы), но не админа бота и не может назначать других."));
    function setNote(parent, text, ok) { parent.className = "msg" + (ok ? " ok" : " err"); parent.textContent = text; }
    function load(note) {
      api("GET", "/api/chats/" + id + "/managers").then(function (r) {
        while (body.firstChild) body.removeChild(body.firstChild);
        if (r.status !== 200) { body.appendChild(el("div", "hint", r.data.message || "Не удалось загрузить список.")); return; }
        draw(r.data, note);
      }).catch(function () { body.appendChild(el("div", "hint", "Нет связи с сервером.")); });
    }
    function draw(d, note) {
      if (!d.managers.length) body.appendChild(el("div", "hint", "Управляющих нет."));
      d.managers.forEach(function (m) {
        var row = el("div", "row mgr");
        var who = el("div", "who");
        who.appendChild(el("div", "", m.name + " (" + m.id + ")"));
        who.appendChild(el("div", "hint", "добавил(а) " + (m.added_by || "?") + (m.added_at ? ", " + m.added_at : "")));
        row.appendChild(who);
        if (d.can_edit) {
          var rb = el("button", "mini", "Убрать");
          rb.addEventListener("click", function () {
            rb.disabled = true;
            api("DELETE", "/api/chats/" + id + "/managers/" + m.id).then(function (r) {
              load(r.data.message || (r.status === 200 ? "Готово." : "Не удалось убрать."));
            }).catch(function () { rb.disabled = false; });
          });
          row.appendChild(rb);
        }
        body.appendChild(row);
      });
      var msg = el("div", "msg");
      if (note) setNote(msg, note, true);
      if (d.can_edit) {
        var add = el("div", "addrow");
        var inp = el("input"); inp.type = "text"; inp.placeholder = "user_id или @username"; inp.maxLength = 40;
        inp.setAttribute("autocomplete", "off");
        var ab = el("button", "mini primary", "Добавить");
        add.appendChild(inp); add.appendChild(ab);
        body.appendChild(add);
        var confirmBox = el("div");
        body.appendChild(confirmBox);
        ab.addEventListener("click", function () {
          var v = inp.value.trim();
          msg.className = "msg"; msg.textContent = "";
          while (confirmBox.firstChild) confirmBox.removeChild(confirmBox.firstChild);
          if (!v) return;
          ab.disabled = true;
          api("POST", "/api/chats/" + id + "/managers", { user: v, confirm: false }).then(function (r) {
            ab.disabled = false;
            if (r.status !== 200) { setNote(msg, r.data.message || "Не удалось добавить.", false); return; }
            if (r.data.found) {
              // ник найден в нашей БД: сначала показываем, кого нашли, назначаем только после подтверждения (по user_id, не по нику)
              confirmBox.appendChild(el("div", "hint", "Найден: " + r.data.found.name + " (" + r.data.found.id + "). Добавить управляющим?"));
              var yes = el("button", "mini primary", "Да, добавить"), no = el("button", "mini", "Отмена");
              var act = el("div", "addrow"); act.appendChild(yes); act.appendChild(no); confirmBox.appendChild(act);
              no.addEventListener("click", function () { while (confirmBox.firstChild) confirmBox.removeChild(confirmBox.firstChild); });
              yes.addEventListener("click", function () {
                yes.disabled = true;
                api("POST", "/api/chats/" + id + "/managers", { user: String(r.data.found.id), confirm: true }).then(function (r2) {
                  if (r2.status === 200) { load(r2.data.message); } else { setNote(msg, r2.data.message || "Не удалось добавить.", false); yes.disabled = false; }
                }).catch(function () { yes.disabled = false; setNote(msg, "Нет связи с сервером.", false); });
              });
              return;
            }
            load(r.data.message);
          }).catch(function () { ab.disabled = false; setNote(msg, "Нет связи с сервером.", false); });
        });
      }
      body.appendChild(msg);
    }
    load();
    return box;
  }

  // ---- Экран «Расходы» (ТЗ tz-miniapp-v2.md, часть A). Только textContent, без innerHTML и внешних библиотек. ----
  var MONTHS = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];

  function money(x) {
    x = Number(x) || 0;
    return "$" + ((x === 0 || Math.abs(x) >= 0.005) ? x.toFixed(2) : x.toFixed(4));
  }
  function monthLabel(m) { return MONTHS[parseInt(m.slice(5, 7), 10) - 1] + " " + m.slice(0, 4); }
  function dayLabel(d) { return d.slice(8, 10) + "." + d.slice(5, 7); }
  function num(n) { return String(Number(n) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

  function kv(parent, k, v, freeText) {
    var row = el("div", "kv");
    row.appendChild(el("span", "k", k));
    var val = el("span", "v", v);
    if (freeText) val.appendChild(el("span", "free", " · бесплатно " + freeText));
    row.appendChild(val);
    parent.appendChild(row);
    return row;
  }
  function bar(parent, share) {
    var b = el("div", "bar"), f = el("div", "fill");
    f.style.width = Math.max(0, Math.min(100, share * 100)) + "%";
    b.appendChild(f);
    parent.appendChild(b);
  }
  function section(title) {
    var card = el("div", "card");
    card.appendChild(el("div", "label", title));
    app.appendChild(card);
    return card;
  }

  function openCosts(id) {
    current = id; screen = "costs"; showBack(true);
    message("Загрузка…");
    api("GET", "/api/chats/" + id + "/costs").then(function (r) {
      if (r.status !== 200) { message(r.data.message || "Ошибка загрузки."); return; }
      renderCosts(r.data);
    }).catch(function () { message("Нет связи с сервером."); });
  }

  function renderCosts(d) {
    clear();
    var h = el("h1", "", "Расходы · " + d.chat.title);
    h.appendChild(el("span", "tag", d.chat.tier === "paid" ? "платный" : "бесплатный"));
    app.appendChild(h);
    var tbtn = el("button", "btn", "Пополнить баланс ⭐");
    tbtn.addEventListener("click", function () { openTopup(current); });
    app.appendChild(tbtn);
    var free = d.show_free === true;

    var head = section("Баланс");
    kv(head, "Баланс", money(d.balance));
    if (d.days_left !== null && d.days_left !== undefined) kv(head, "Хватит примерно", "на " + d.days_left + " дн.");
    kv(head, "Темп (последние 7 дней)", money(d.rate_7d_per_day) + " / день");
    var sub = d.subscription;   // оценка цены подписки по расходу в платном режиме (только платное, видно всем, кто видит расходы)
    if (sub) {
      if (sub.enough) {
        kv(head, "В режиме подписки", "месяц ≈ " + money(sub.month) + ", неделя ≈ " + money(sub.week));
        head.appendChild(el("div", "hint", "по " + Number(sub.paid_days).toFixed(1) + " дн. платного режима с " + dayLabel(sub.since)));
      } else {
        kv(head, "Цена подписки", "мало данных");
        head.appendChild(el("div", "hint", Number(sub.paid_days).toFixed(1) + " дн. в платном режиме, нужно 7"));
      }
    }

    var any = d.months.some(function (m) { return m.paid > 0 || (free && m.free > 0); }) || d.by_model.length > 0;
    if (!any) { app.appendChild(el("div", "center", "Расходов пока нет.")); return; }

    if (d.weeks && d.weeks.length) {
      var wkc = section("По неделям");
      var maxW = Math.max.apply(null, d.weeks.map(function (w) { return w.paid; }).concat([0.000001]));
      d.weeks.forEach(function (w) {
        kv(wkc, "KW " + w.kw + " " + w.iso_year + " · " + dayLabel(w.start) + "–" + dayLabel(w.end) + (w.partial ? " (по сегодня)" : ""),
           money(w.paid), free ? money(w.free) : null);
        bar(wkc, w.paid / maxW);
      });
    }

    var mo = section("По месяцам");
    var maxM = Math.max.apply(null, d.months.map(function (m) { return m.paid; }).concat([0.000001]));
    d.months.forEach(function (m) {
      kv(mo, monthLabel(m.month) + (m.partial ? " (по сегодня)" : ""), money(m.paid), free ? money(m.free) : null);
      bar(mo, m.paid / maxM);
    });

    var dy = section("По дням (7)");
    d.days.forEach(function (x) { kv(dy, dayLabel(x.date), money(x.paid), free ? money(x.free) : null); });

    if (d.by_model.length) {
      var md = section("По моделям (7 дней)");
      d.by_model.forEach(function (r) {
        var t = r.label + (free && !r.billed ? " · бесплатное" : "");
        kv(md, t, money(r.cost));
        var det = r.calls + " выз.";
        if (r.kind === "llm") det += ", вх " + num(r.input) + " / вых " + num(r.output);
        md.appendChild(el("div", "hint", det));
      });
    }
    if (d.by_label.length) {
      var lb = section("По меткам (7 дней)");
      d.by_label.forEach(function (r) { kv(lb, r.label + (free && !r.billed ? " · бесплатное" : ""), money(r.cost)); });
    }
    var wk = d.by_kind_week;
    app.appendChild(el("div", "hint", "За неделю: LLM " + money(wk.llm) + " · картинки " + money(wk.image) + " · поиск " + money(wk.search)));
  }

  // ---- Экран «Пополнить» (ТЗ tz-stars-topup.md). Баланс зачисляет ТОЛЬКО бот по successful_payment; статус openInvoice — лишь подсказка UI. ----
  function openTopup(id, note) {
    current = id; screen = "topup"; showBack(true);
    message("Загрузка…");
    api("GET", "/api/chats/" + id + "/topup").then(function (r) {
      if (r.status !== 200) { message(r.data.message || "Ошибка загрузки."); return; }
      renderTopup(id, r.data, note);
    }).catch(function () { message("Нет связи с сервером."); });
  }

  function renderTopup(id, d, note) {
    clear();
    app.appendChild(el("h1", "", "Пополнить · " + d.title));
    var head = section("Баланс");
    kv(head, "Сейчас", money(d.balance));
    head.appendChild(el("div", "hint", "1 ⭐ = " + money(d.rate) + " на баланс. Оплата звёздами Telegram."));
    var msg = el("div", "msg" + (note ? " ok" : ""), note || "");
    var buttons = [];
    d.packs.forEach(function (p) {
      var b = el("button", "pack");
      b.appendChild(el("span", "", p.stars + " ⭐"));
      b.appendChild(el("span", "usd", "≈ " + money(p.usd)));
      b.addEventListener("click", function () { pay(id, p.stars, buttons, msg); });
      buttons.push(b);
      app.appendChild(b);
    });
    app.appendChild(msg);
    var det = el("details", "help");
    det.appendChild(el("summary", "", "Как купить звёзды из России"));
    det.appendChild(el("div", "helptext", String(d.help || "").replace(/\*\*/g, "")));
    app.appendChild(det);
    app.appendChild(el("div", "hint", "Условия — команда /terms, проблемы с оплатой — /paysupport в чате с ботом."));
  }

  function setBusy(buttons, on) { buttons.forEach(function (b) { b.disabled = on; }); }

  function pay(id, stars, buttons, msg) {
    msg.className = "msg"; msg.textContent = "";
    if (!tg || !tg.openInvoice) { msg.className = "msg err"; msg.textContent = "Обновите Telegram: эта версия не умеет открывать оплату."; return; }
    setBusy(buttons, true);
    api("POST", "/api/chats/" + id + "/topup", { stars: stars }).then(function (r) {
      if (r.status !== 200 || !r.data.invoice_link) {
        setBusy(buttons, false); msg.className = "msg err"; msg.textContent = r.data.message || "Не удалось создать счёт."; return;
      }
      tg.openInvoice(r.data.invoice_link, function (status) {
        if (status === "paid") {
          // зачисление делает бот по successful_payment — даём ему секунду-две и перечитываем баланс
          msg.className = "msg ok"; msg.textContent = "Оплачено! Зачисляю…";
          setTimeout(function () { if (screen === "topup" && current === id) openTopup(id, "Оплата прошла. Если баланс ещё не вырос — обновите экран через пару секунд."); }, 2500);
        } else {
          setBusy(buttons, false);
          msg.className = "msg " + (status === "failed" ? "err" : "");
          msg.textContent = status === "failed" ? "Оплата не прошла." : (status === "pending" ? "Платёж обрабатывается, баланс обновится сам." : "Оплата отменена.");
        }
      });
    }).catch(function () { setBusy(buttons, false); msg.className = "msg err"; msg.textContent = "Нет связи с сервером."; });
  }

  // start_param ссылки t.me/<bot>?startapp=chat_n<abs(chat_id)> → id чата (n — минус группы, p — плюс). Ничего не разрешает: права проверяет сервер.
  function parseStartParam(p) {
    var m = /^chat_([np])(\d{1,15})$/.exec(p || "");
    return m ? (m[1] === "n" ? -1 : 1) * parseInt(m[2], 10) : null;
  }

  function setMsg(card, text, ok) {
    var m = card.querySelector(".msg");
    m.textContent = text || "";
    m.className = "msg " + (text ? (ok ? "ok" : "err") : "");
  }

  function settingCard(chatId, s) {
    var card = el("div", "card");
    card.dataset.key = s.key;
    fill(card, chatId, s);
    return card;
  }

  function fill(card, chatId, s) {
    while (card.firstChild) card.removeChild(card.firstChild);
    var control;
    if (s.value === null && !s.can_change && s.kind !== "choice") {
      // смотреть нельзя (например, автоигнор для не-админа)
      card.appendChild(el("div", "label", s.label));
      card.appendChild(el("div", "hint", s.reason || "Недоступно."));
      card.appendChild(el("div", "msg"));
      return;
    }
    if (s.kind === "choice") {
      card.appendChild(el("div", "label", s.label));
      control = el("select");
      (s.choices || []).forEach(function (c) {
        var o = el("option", "", c.allowed ? c.label : c.label + " 🔒");
        o.value = c.value; o.disabled = !c.allowed && c.value !== s.value;
        if (c.value === s.value) o.selected = true;
        control.appendChild(o);
      });
      control.disabled = !s.can_change;
      control.addEventListener("change", function () { save(card, chatId, s, control.value); });
      card.appendChild(control);
    } else if (s.kind === "bool") {
      var row = el("div", "row");
      row.appendChild(el("div", "label", s.label));
      var sw = el("label", "switch");
      control = el("input"); control.type = "checkbox"; control.checked = s.value === true; control.disabled = !s.can_change;
      sw.appendChild(control); sw.appendChild(el("span", "slider"));
      control.addEventListener("change", function () { save(card, chatId, s, control.checked); });
      row.appendChild(sw);
      card.appendChild(row);
    } else {
      var lab = el("div", "label", s.label + ": ");
      var val = el("span", "", String(s.value === null ? "" : s.value));
      lab.appendChild(val);
      card.appendChild(lab);
      control = el("input"); control.type = "range";
      control.min = s.int_range[0]; control.max = s.int_range[1]; control.step = 1; control.value = s.value === null ? s.int_range[0] : s.value;
      control.disabled = !s.can_change;
      control.addEventListener("input", function () { val.textContent = control.value; });
      control.addEventListener("change", function () { save(card, chatId, s, parseInt(control.value, 10)); });
      card.appendChild(control);
    }
    var hint = (s.note ? s.note : "");
    if (!s.can_change && s.reason) hint = hint ? hint + ". " + s.reason : s.reason;
    if (s.can_change && s.choices) {
      var locked = s.choices.filter(function (c) { return !c.allowed; })[0];
      if (locked && locked.reason) hint = hint ? hint + ". " + locked.reason : locked.reason;
    }
    if (hint) card.appendChild(el("div", "hint", hint));
    card.appendChild(el("div", "msg"));
  }

  function save(card, chatId, s, value) {
    setMsg(card, "Сохраняю…", true);
    api("POST", "/api/chats/" + chatId + "/settings/" + s.key, { value: value }).then(function (r) {
      if (r.status === 200 && r.data.ok) {
        fill(card, chatId, r.data.setting);
        setMsg(card, r.data.message || "Сохранено.", true);
      } else {
        setMsg(card, r.data.message || "Не удалось сохранить.", false);
        // перечитать состояние с сервера: форма не должна показывать то, чего нет
        api("GET", "/api/chats/" + chatId + "/settings").then(function (g) {
          if (g.status !== 200) return;
          var fresh = g.data.settings.filter(function (x) { return x.key === s.key; })[0];
          if (fresh) { var msg = r.data.message; fill(card, chatId, fresh); setMsg(card, msg || "Не удалось сохранить.", false); }
        });
      }
    }).catch(function () { setMsg(card, "Нет связи с сервером.", false); });
  }

  if (!initData) {
    message("Откройте приложение из Telegram: кнопка «Настройки» в личке с ботом или команда /settings.");
    return;
  }
  // Выбор экрана: start_param (Main Mini App из группы) → ?chat= (диплинк из личной переписки, v1) → список чатов.
  var sp = tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param : "";
  var q = /[?&]chat=(-?\d+)/.exec(location.search);
  directChat = parseStartParam(sp);
  if (directChat === null) directChat = q ? parseInt(q[1], 10) : null;
  if (directChat !== null) { openChat(directChat); } else { openList(); }
})();
</script>
</body>
</html>
