services:
  claudushka:
    image: python:3.12-slim
    container_name: claudushka
    working_dir: /app
    volumes:
      - ./bot.py:/app/bot.py
      - ./requirements.txt:/app/requirements.txt
      - ./allowed.json:/app/allowed.json
    env_file:
      - .env
    command: /bin/sh -c "pip install --no-cache-dir -r requirements.txt && python bot.py"
    restart: unless-stopped
