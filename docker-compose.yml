services:
  claudushka:
    image: python:3.12-slim
    container_name: claudushka
    working_dir: /app
    volumes:
      - ./bot.py:/app/bot.py
      - ./db.py:/app/db.py
      - ./requirements.txt:/app/requirements.txt
      - ./allowed.json:/app/allowed.json
      - ./data:/app/data
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/repo
    command: /bin/sh -c "pip install --no-cache-dir -r requirements.txt && apt-get update -qq && apt-get install -y -qq docker.io git && python bot.py"
    restart: unless-stopped

  claudushka-wa:
    image: python:3.12-slim
    container_name: claudushka-wa
    working_dir: /app
    volumes:
      - ./whatsapp.py:/app/whatsapp.py
      - ./db.py:/app/db.py
      - ./requirements.txt:/app/requirements.txt
      - ./data:/app/data
    env_file:
      - .env
    ports:
      - "8080:8080"
    command: /bin/sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn whatsapp:app --host 0.0.0.0 --port 8080"
    restart: unless-stopped
